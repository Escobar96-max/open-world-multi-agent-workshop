name: CI/CD Multi-Agent Publish Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate Python Backend & Multi-Agent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Modules Syntax & Imports
        run: |
          python -m py_compile ollama-developer-team-v2.py
          python -m py_compile agent-web-server.py
          python -m py_compile agent-safety-guardrails.py
          python -m py_compile sim_engine.py

      - name: Execute Multi-Agent Verification Suite
        run: |
          python ollama-developer-team-v2.py

  frontend-build:
    name: Build & Verify Frontend Visualizer Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Vite Production Bundle
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-world-visualizer-dist
          path: dist/
