# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be rigorous, precise, and emphasize security, path traversal guards, and autonomous agent safety."
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "draft"
    drafts: false
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
chat:
  auto_reply: true
